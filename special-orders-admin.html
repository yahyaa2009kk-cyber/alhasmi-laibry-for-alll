<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات الخاصة | مكتبة الهاشمي</title><style>body{margin:0;background:#080808;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.box{background:#111;border:1px solid #3a3018;border-radius:18px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}input,select,textarea{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #353535;border-radius:10px;padding:11px;margin-top:5px}button{background:#c9a227;color:#080706;border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.muted{color:#aaa}.order{border:1px solid #292929;border-radius:14px;padding:14px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ok{background:#17351f;color:#bcebc9;border:1px solid #3d8e5c}</style></head><body><div class="wrap"><div id="login" class="box"><h2>🔐 إدارة الطلبات الخاصة</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="loginBtn">دخول</button><p id="msg" class="muted"></p></div><div id="app" style="display:none"><div class="box"><h2>📝 الطلبات الخاصة</h2><button id="refresh">↻ تحديث</button> <button id="logout">خروج</button></div><div id="list"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bfiobmxgkxrmkukorqdq.supabase.co','sb_publishable_3zAtbhl55a-jSMvuIGd6cw_LFv1nyCJ');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const {data:{session}}=await db.auth.getSession();set(session);db.auth.onAuthStateChange((_e,s)=>set(s))}function set(s){$('login').style.display=s?'none':'block';$('app').style.display=s?'block':'none';if(s)load()}$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('msg').textContent=error?error.message:'تم الدخول'};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=()=>db.auth.signOut();$('refresh').onclick=load;async function load(){ $('list').innerHTML='<div class="box muted">جاري التحميل...</div>';const {data,error}=await db.from('special_orders').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="box">خطأ: '+esc(error.message)+'</div>';return}$('list').innerHTML=(data||[]).map(x=>`<div class="box order"><h3>${esc(x.order_number)} — ${esc(x.customer_name||'')}</h3><div class="muted">📞 ${esc(x.customer_phone||'')}<br>📚 ${esc(x.subject||'')}<br>📝 ${esc(x.details)}<br>💳 ${esc(x.payment_status)} — 📦 ${esc(x.fulfillment_status)}</div><div class="grid"><div><label>السعر</label><input id="amt-${x.id}" type="number" value="${Number(x.amount||0)}"></div><div><label>نسخة التسليم</label><select id="var-${x.id}"><option value="preview" ${x.delivery_variant==='preview'?'selected':''}>نسخة مائية/تجريبية</option><option value="editable" ${x.delivery_variant==='editable'?'selected':''}>نسخة قابلة للتعديل</option><option value="final" ${x.delivery_variant==='final'?'selected':''}>النسخة النهائية</option></select></div><div><label>نسخة مائية</label><input id="prev-${x.id}" type="file" accept="application/pdf"></div><div><label>نسخة قابلة للتعديل</label><input id="edit-${x.id}" type="file" accept="application/pdf"></div><div><label>النسخة النهائية</label><input id="final-${x.id}" type="file" accept="application/pdf"></div><div><label>ملاحظة</label><textarea id="note-${x.id}">${esc(x.admin_note||'')}</textarea></div></div><div class="actions"><button class="ok" onclick="saveOrder('${x.id}')">💾 حفظ وربط الملفات</button></div></div>`).join('')||'<div class="box muted">لا توجد طلبات خاصة.</div>'}async function upload(id,file,prefix){if(!file)return null;const path=`special/${id}/${prefix}-${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const r=await db.storage.from('library-files').upload(path,file,{contentType:'application/pdf',upsert:false});if(r.error)throw r.error;return path}async function saveOrder(id){try{const {data:old,error}=await db.from('special_orders').select('*').eq('id',id).single();if(error)throw error;const paths={};paths.preview_path=await upload(id,$('prev-'+id).files[0],'preview')||old.preview_path;paths.editable_file_path=await upload(id,$('edit-'+id).files[0],'editable')||old.editable_file_path;paths.final_file_path=await upload(id,$('final-'+id).files[0],'final')||old.final_file_path;const r=await db.from('special_orders').update({amount:Math.max(0,Number($('amt-'+id).value||0)),delivery_variant:$('var-'+id).value,admin_note:$('note-'+id).value.trim(),...paths}).eq('id',id);if(r.error)throw r.error;alert('تم الحفظ ✅');load()}catch(e){alert('خطأ: '+(e.message||e))}}boot();</script></body></html>
